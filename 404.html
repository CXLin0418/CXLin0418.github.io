  <title>Page not found · Xilin Chen</title>
  <script>
    // Forward bookmarks from the original folder after removing its duplicate files.
    const movedPages = new Map([
      ["/xilin-chen-website", "/"],
      ["/xilin-chen-website/", "/"],
      ["/xilin-chen-website/index.html", "/"],
      ["/xilin-chen-website/research.html", "/research.html"],
      ["/xilin-chen-website/workflow.html", "/workflow.html"],
      ["/xilin-chen-website/playground.html", "/playground.html"]
    ]);
    const destination = movedPages.get(location.pathname);
    if (destination) location.replace(destination + location.search + location.hash);
  </script>

  <link rel="stylesheet" href="/assets/styles.css">
</head>
